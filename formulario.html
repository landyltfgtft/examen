<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FORMULARIO HTML</title>
   <a href="index.html">REGRESAR</a>
  <style>
    h1 {
      text-align: center;
      color: brown;
    }
    form {
      width: 600px;
      margin: auto;
    }
    label {
      display: inline-block;
      width: 180px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 250px;
      margin-bottom: 8px;
    }
    hr {
      margin-top: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>FORMULARIO HTML</h1>
  <hr>
  <br><br>

  <form>
    <label>Nombre:</label>
    <input type="text" name="nombre"><br>

    <label>Apellidos:</label>
    <input type="text" name="apellidos"><br>

    <label>Correo electrónico:</label>
    <input type="email" name="correo"><br>

    <label>Teléfono:</label>
    <input type="tel" name="telefono"><br>

    <label>Fecha de Nacimiento:</label>
    <select name="dia">
      <option>Día</option>
      <!-- Días 1–31 -->
      <script>
        for(let i=1;i<=31;i++)document.write(`<option>${i}</option>`);
      </script>
    </select>
    <select name="mes">
      <option>Mes</option>
      <option>Enero</option><option>Febrero</option><option>Marzo</option>
      <option>Abril</option><option>Mayo</option><option>Junio</option>
      <option>Julio</option><option>Agosto</option><option>Septiembre</option>
      <option>Octubre</option><option>Noviembre</option><option>Diciembre</option>
    </select>
    <select name="anio">
      <option>Año</option>
      <script>
        for(let i=2000;i<=2026;i++)document.write(`<option>${i}</option>`);
      </script>
    </select><br>

    <label>Link de Facebook:</label>
    <input type="url" name="facebook"><br>

    <label>Contraseña:</label>
    <input type="password" name="password"><br>

    <label>Observaciones:</label>
    <textarea name="observaciones" rows="3"></textarea><br>

    <label>Número de Hermanos:</label>
    <input type="number" name="hermanos" min="0"><br>

    <label>Género:</label>
    <select name="genero">
      <option>Selecciona</option>
      <option>Femenino</option>
      <option>Masculino</option>
      <option>Otro</option>
    </select><br>

    <label>Semestre:</label>
    <select name="semestre">
      <option>Selecciona</option>
      <script>
        for(let i=1;i<=12;i++)document.write(`<option>${i}</option>`);
      </script>
    </select><br>

    <label>Carrera:</label>
    <input list="carreras" name="carrera">
    <datalist id="carreras">
      <option value="Programación">
      <option value="Diseño Gráfico">
      <option value="Administración">
      <option value="Contabilidad">
      <option value="Electrónica">
    </datalist><br>

    <input type="hidden" name="matricula" value="123456"><br>

    <input type="submit" value="Enviar">
    <input type="reset" value="Borrar">
  </form>
</body>
</html>
